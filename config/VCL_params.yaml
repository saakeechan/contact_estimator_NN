# Ordered continual-learning tasks over cmd_vel_x. Each range is [low, high).
continual_feature: "cmd_vel_x"
continual_task_windows:
  - [0.0, 1.0]
  - [1.0, 2.0]
evaluation_window: [0.0, 3.0]

# q(w) = Normal(mu, softplus(rho)^2). Task 0's prior is N(0, vcl_prior_sigma^2);
# after a task, its posterior is copied into the propagation checkpoint's prior buffers.
vcl_rho: -3.0
vcl_prior_sigma: 1.0
vcl_train_mc_samples: 20
vcl_evaluation_mc_samples: 30
vcl_kl_scale: 2.0  # Diagnostic ablation multiplier; keep 1.0 for the VCL baseline.

# Fraction selected before each deterministic run-disjoint train/validation split.
vcl_data_fraction: 0.5

# Adam is recreated for every task; posterior parameters are retained.
vcl_init_lr: 1.0e-3
vcl_gradient_clip_norm: 10.0
vcl_lr_patience: 5
vcl_lr_factor: 3.0
vcl_min_lr: 1.0e-6
vcl_max_lr_updates: 3

# Run tests/base_testSeries.py over this window after every task posterior checkpoint.
vcl_evaluate_after_task: true
vcl_evaluation_first_seed: 0
vcl_evaluation_last_seed: 100
